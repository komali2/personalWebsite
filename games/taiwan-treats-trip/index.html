<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taiwan Treats Trip 吃飽逃颱</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#181425">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="吃飽逃颱">
<meta name="description" content="Drive Taiwan's winding mountain roads, eat every snack you can, and outrun Typhoon Hangry.">
<!--
  Taiwan Treats Trip 吃飽逃颱

  Source and build tools: https://github.com/komali2/personalWebsite/tree/master/dev/taiwan-treats-trip

  A road-trip game for Jeremy, Riley, Caleb, Lauren and Rachel. Single self-contained file:
  vanilla Canvas 2D, pixel art authored as text grids (SPR, near the end), WebAudio synth sound.

  Font: Cubic 11 / 俐方體11號 (OFL-1.1, https://github.com/ACh-K/Cubic-11), subset to the characters
  used here, with pinyin tone vowels (ā ǎ ē ě ī ǐ ū ǔ) added. It lives base64-encoded in the last
  <script>. If you add text with new CJK or tone characters, re-subset the font, otherwise those
  characters fall back to a system font.

<style>
:root{--k:#181425;--n:#262b44;--N:#3a4466;--g:#5a6988;--G:#8b9bb4;--l:#c0cbdc;--w:#fff;--r:#a22633;--R:#e43b44;--o:#f77622;--y:#feae34;--Y:#fee761;--e:#63c74d;--E:#3e8948;--B:#0099db;--c:#2ce8f5;--q:#b55088;--s:#f6757a;--P:#68386c;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e0b16;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font-family:Cubic11,"Noto Sans TC","PingFang TC","Microsoft JhengHei",monospace;color:var(--w);font-size:12px;line-height:14px;-webkit-font-smoothing:none;font-smooth:never}
#frame{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100vh * 0.5625));width:min(100vw,calc(100dvh * 0.5625));height:100vh;height:100dvh;overflow:hidden;background:var(--k)}
@media (max-aspect-ratio:3/4){#frame{width:100vw}}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.big{font-size:24px;line-height:28px}
.huge{font-size:48px;line-height:52px}
.dim{color:var(--G)}
.hide{display:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hudTop{position:absolute;left:8px;right:8px;top:calc(var(--st) + 6px);display:flex;align-items:flex-start;gap:8px}
#scoreBox{flex:1;min-width:0}
#score{font-size:24px;line-height:26px;text-shadow:2px 2px 0 var(--k),-1px -1px 0 var(--k),1px -1px 0 var(--k),-1px 1px 0 var(--k)}
#combo{display:inline-block;margin-top:2px;padding:1px 4px;background:var(--Y);color:var(--k);box-shadow:0 0 0 2px var(--k)}
#combo.x1{visibility:hidden}
.meter{display:flex;align-items:center;gap:4px;margin-top:6px;height:14px}
.meter img{width:24px;height:24px;margin:-5px 0}
.bar{position:relative;flex:0 0 112px;height:10px;background:var(--k);box-shadow:0 0 0 2px var(--k)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--e);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#bellyFill.low{background:var(--R);animation:blink .4s steps(2) infinite}
#stormBar{background:linear-gradient(90deg,#68386c,#262b44 60%,#181425)}
#stormBar>b{position:absolute;top:-7px;width:24px;height:24px;margin-left:-12px}
#stormBar>u{position:absolute;right:-8px;top:-7px;width:24px;height:24px}
#stormTxt{font-size:12px;text-shadow:1px 1px 0 var(--k)}
#mapWrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#minimap{width:72px;height:120px;background:rgba(18,78,137,.55);box-shadow:0 0 0 2px var(--k)}
#pauseBtn{pointer-events:auto;width:36px;height:36px;border:0;background:var(--N);box-shadow:0 0 0 2px var(--k),inset 0 -3px 0 var(--n);display:flex;align-items:center;justify-content:center}
#pauseBtn img{width:18px;height:18px}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;opacity:0;transition:opacity .3s,transform .3s;transform:translateY(-8px)}
#banner.on{opacity:1;transform:none}
#banner .zh{font-size:48px;line-height:52px;color:var(--Y);text-shadow:3px 3px 0 var(--k),-2px -2px 0 var(--k),2px -2px 0 var(--k),-2px 2px 0 var(--k)}
#banner .en{font-size:24px;line-height:28px;text-shadow:2px 2px 0 var(--k),-1px -1px 0 var(--k)}
#banner .sp{margin-top:6px;display:flex;justify-content:center;gap:6px}
#banner .sp img{width:36px;height:36px}
#abilityBtn{pointer-events:auto;position:absolute;right:14px;bottom:calc(var(--sb) + 16px);width:76px;height:76px;border:0;border-radius:50%;background:conic-gradient(var(--Y) var(--p,0%),#262b44 0);box-shadow:0 0 0 3px var(--k);display:flex;align-items:center;justify-content:center;opacity:.9}
#abilityBtn img{width:56px;height:56px;border-radius:50%;background:var(--n);box-shadow:0 0 0 3px var(--k);filter:grayscale(.7) brightness(.8)}
#abilityBtn.ready{animation:pulse .8s ease-in-out infinite}
#abilityBtn.ready img{filter:none}
#abilityBtn.active img{filter:none;box-shadow:0 0 0 3px var(--Y)}
#crew{position:absolute;left:10px;bottom:calc(var(--sb) + 14px);display:flex;gap:4px}
#crew img{width:32px;height:32px;background:var(--n);box-shadow:0 0 0 2px var(--k)}
#crew img.lost{filter:grayscale(1) brightness(.5);opacity:.6}
#toast{position:absolute;left:50%;bottom:calc(var(--sb) + 110px);transform:translateX(-50%);background:var(--k);padding:6px 10px;box-shadow:0 0 0 2px var(--G);opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--k),0 0 0 7px var(--Y)}}
@keyframes blink{50%{opacity:.4}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(var(--st) + 16px) 14px calc(var(--sb) + 18px)}
.screen.on{display:flex}
.scrim{background:rgba(24,20,37,.82)}
.panel{background:var(--n);box-shadow:0 0 0 3px var(--k),inset 0 0 0 2px var(--N);padding:10px 12px;width:100%;max-width:400px}
.btn{font:inherit;font-size:24px;line-height:26px;color:var(--k);background:var(--Y);border:0;padding:8px 18px 11px;box-shadow:0 0 0 3px var(--k),inset 0 -4px 0 var(--o);cursor:pointer;min-width:120px}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 3px var(--k),inset 0 -2px 0 var(--o)}
.btn.alt{background:var(--l);box-shadow:0 0 0 3px var(--k),inset 0 -4px 0 var(--G)}
.btn.sm{font-size:12px;line-height:14px;padding:6px 10px 8px;min-width:0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
h2{font-size:24px;line-height:28px;font-weight:normal;text-align:center;margin:4px 0 10px;text-shadow:2px 2px 0 var(--k)}
h3{font-size:12px;font-weight:normal;color:var(--Y);margin:12px 0 6px;text-transform:uppercase;letter-spacing:1px}

#title{justify-content:space-between}
#logo{margin-top:6vh;text-align:center;background:rgba(24,20,37,.72);box-shadow:0 0 0 3px rgba(24,20,37,.72);padding:10px 14px 12px}
#logo .en{font-size:24px;line-height:28px;letter-spacing:2px;text-shadow:2px 2px 0 var(--k)}
#logo .zh{font-size:48px;line-height:56px;color:var(--Y);text-shadow:4px 4px 0 var(--r),-2px -2px 0 var(--k),2px -2px 0 var(--k),-2px 2px 0 var(--k),6px 6px 0 var(--k)}
#logo .sub{margin-top:8px;color:var(--l);text-shadow:1px 1px 0 var(--k)}
#titleBtns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:4vh}
#bestLine{text-shadow:1px 1px 0 var(--k)}
#toggles{position:absolute;right:10px;top:calc(var(--st) + 10px);display:flex;gap:8px}
.tgl{font:inherit;width:40px;height:40px;border:0;background:var(--N);box-shadow:0 0 0 2px var(--k),inset 0 -3px 0 var(--n);color:var(--w);display:flex;align-items:center;justify-content:center}
.tgl img{width:27px;height:27px}
.tgl.off{opacity:.55}

.cards{display:grid;gap:10px;width:100%;max-width:400px}
.card{font:inherit;color:var(--w);text-align:left;border:0;background:var(--n);box-shadow:0 0 0 3px var(--k),inset 0 0 0 2px var(--N);padding:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.card.sel{background:var(--N);box-shadow:0 0 0 3px var(--Y),inset 0 0 0 2px var(--g)}
.card img{flex:none}
.card b{font-weight:normal;font-size:24px;line-height:26px;display:block}
.card em{font-style:normal;color:var(--Y);display:block;margin:2px 0}
.card small{font-size:12px;color:var(--l);display:block}
#vehCards{grid-template-columns:1fr 1fr}
#vehCards .card{flex-direction:column;text-align:center;gap:6px}
#goBar{position:sticky;bottom:0;padding-top:14px;width:100%;display:flex;justify-content:center}

#over .panel{margin-bottom:12px}
#caughtAt{color:var(--l);text-align:center}
#routeMap{display:block;margin:8px auto 0;background:#124e89;box-shadow:0 0 0 3px var(--k)}
#routeTxt{text-align:center;margin-top:6px;color:var(--Y)}
.stats{display:flex;justify-content:space-around;text-align:center;margin:4px 0}
.stats b{display:block;font-weight:normal;font-size:24px;line-height:28px}
#newBest{color:var(--Y);text-align:center;animation:blink .5s steps(2) infinite}
#tally{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center}
#tally span{display:flex;align-items:center;gap:2px}
#tally img{width:24px;height:24px}
#quips div{display:flex;gap:8px;align-items:center;margin:6px 0}
#quips img{width:32px;height:32px;flex:none;background:var(--N);box-shadow:0 0 0 2px var(--k)}

#logGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:400px}
#logGrid button{font:inherit;color:var(--w);border:0;background:var(--n);box-shadow:0 0 0 2px var(--k),inset 0 0 0 2px var(--N);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#logGrid img{width:36px;height:36px}
#logGrid .rg{font-size:12px;color:var(--Y);grid-column:1/-1;margin-top:6px}
#logDetail{text-align:center}
#logDetail img{width:72px;height:72px}
#logDetail .zh{font-size:24px;line-height:28px;color:var(--Y)}
#credits p,#aboutS p{margin:8px 0;color:var(--l)}
#credits a,#aboutS a{color:var(--c)}
#aboutS b{font-weight:normal;color:var(--Y)}
pre.lic{white-space:pre-wrap;font:inherit;font-size:12px;color:var(--G);margin-top:8px;max-height:220px;overflow:auto;touch-action:pan-y}
</style>
</head>
<body>
<div id="frame">
  <canvas id="game"></canvas>

  <div id="hud" class="hide">
    <div id="hudTop">
      <div id="scoreBox">
        <div id="score">0</div>
        <div id="combo" class="x1">×1</div>
        <div class="meter"><img class="px" id="bellyIco" alt=""><div class="bar"><i id="bellyFill"></i></div></div>
        <div class="meter"><div class="bar" id="stormBar"><b><img class="px" id="stormIco" alt="" width="24" height="24"></b><u><img class="px" id="carIco" alt="" width="24" height="24"></u></div></div>
        <div id="stormTxt"></div>
      </div>
      <div id="mapWrap">
        <button id="pauseBtn" aria-label="Pause"><img class="px" id="pauseIco" alt=""></button>
        <canvas id="minimap" class="px" width="36" height="60"></canvas>
      </div>
    </div>
    <div id="banner"></div>
    <div id="crew"></div>
    <button id="abilityBtn" aria-label="Ability"><img class="px" id="abilityImg" alt=""></button>
  </div>

  <div id="title" class="screen">
    <div id="toggles">
      <button class="tgl" id="tglSound" aria-label="Sound"><img class="px" alt=""></button>
      <button class="tgl" id="tglMotion" aria-label="Reduced motion">≈</button>
      <button class="tgl" id="tglLang" aria-label="Language / 語言">中</button>
    </div>
    <div id="logo">
      <div class="en">TAIWAN TREATS TRIP</div>
      <div class="zh">吃飽逃颱</div>
      <div class="sub" data-i="sub">Eat your fill. Outrun Typhoon Hangry.</div>
    </div>
    <div id="titleBtns">
      <button class="btn" id="playBtn" data-i="play">PLAY</button>
      <div class="row">
        <button class="btn alt sm" id="logBtn" data-i="log">SNACK LOG 圖鑑</button>
        <button class="btn alt sm" id="credBtn" data-i="credits">CREDITS</button>
        <button class="btn alt sm" id="aboutBtn" data-i="about">ABOUT</button>
      </div>
      <div id="bestLine"></div>
    </div>
  </div>

  <div id="select" class="screen scrim">
    <h2 data-i="pickRide">Pick your ride</h2>
    <div class="cards" id="vehCards"></div>
    <h2 style="margin-top:16px" data-i="whoLeads">Who's leading?</h2>
    <div class="cards" id="leadCards"></div>
    <div id="goBar"><button class="btn" id="goBtn" data-i="go">GO!</button></div>
  </div>

  <div id="pause" class="screen scrim" style="justify-content:center">
    <div class="panel" style="text-align:center">
      <h2 data-i="paused">Paused</h2>
      <div class="row" style="flex-direction:column;align-items:center;gap:14px">
        <button class="btn" id="resumeBtn" data-i="resume">RESUME</button>
        <div class="row">
          <button class="btn alt sm" id="pSound">SOUND</button>
          <button class="btn alt sm" id="pMotion">MOTION</button>
          <button class="btn alt sm" id="pLang">中文</button>
        </div>
        <button class="btn alt sm" id="quitBtn" data-i="quit">QUIT TO MENU</button>
      </div>
    </div>
  </div>

  <div id="over" class="screen scrim">
    <div class="panel">
      <h2 id="overTitle" data-i="caught">HANGRY CAUGHT YOU</h2>
      <div id="caughtAt"></div>
      <canvas id="routeMap" class="px"></canvas>
      <div id="routeTxt"></div>
    </div>
    <div class="panel">
      <div class="stats"><div><span data-i="score">SCORE</span><b id="oScore">0</b></div><div><span data-i="snacks">SNACKS</span><b id="oSnacks">0</b></div><div><span data-i="best">BEST</span><b id="oBest">0</b></div></div>
      <div id="newBest" class="hide" data-i="newBest">NEW BEST!</div>
      <h3 data-i="eaten">Snacks eaten</h3>
      <div id="tally"></div>
      <h3 data-i="crewSays">The crew says</h3>
      <div id="quips"></div>
    </div>
    <div class="row" style="margin-top:4px">
      <button class="btn" id="againBtn" data-i="again">AGAIN</button>
      <button class="btn alt" id="shareBtn" data-i="share">SHARE</button>
    </div>
    <button class="btn alt sm" id="menuBtn" style="margin-top:14px" data-i="menu">MENU</button>
  </div>

  <div id="log" class="screen scrim">
    <h2 data-i="logTitle">Snack Log 圖鑑</h2>
    <div id="logCount" class="dim" style="margin-bottom:8px"></div>
    <div class="panel hide" id="logDetail" style="margin-bottom:12px"></div>
    <div id="logGrid"></div>
    <button class="btn alt sm" id="logBack" style="margin-top:16px" data-i="back">BACK</button>
  </div>

  <div id="credits" class="screen scrim">
    <h2 data-i="credTitle">Credits</h2>
    <div class="panel">
      <p data-ih="cred1"></p>
      <p data-ih="cred2"></p>
      <p data-ih="cred4"></p>
      <p data-ih="cred5"></p>
      <p data-ih="cred6"></p>
      <pre class="lic" id="licText"></pre>
    </div>
    <button class="btn alt sm" id="credBack" style="margin-top:16px" data-i="back">BACK</button>
  </div>

  <div id="aboutS" class="screen scrim">
    <h2 data-i="aboutTitle">About</h2>
    <div class="panel">
      <p data-ih="about1"></p>
      <p data-ih="about2"></p>
      <h3 data-i="whyTitle">Why?</h3>
      <p data-ih="why"></p>
    </div>
    <button class="btn alt sm" id="aboutBack" style="margin-top:16px" data-i="back">BACK</button>
  </div>

  <div id="toast"></div>
</div>
<script>
'use strict';
// one canonical origin, so localStorage (high scores, snack log) is shared
if (location.hostname === 'calebjay.com') location.replace('https://www.calebjay.com' + location.pathname + location.search + location.hash);
/* =========================================================================
   Taiwan Treats Trip 吃飽逃颱: constants, utils, data
   ========================================================================= */
const PAL_KEYS = 'knNgGlwrRpsoyYeEfFbBcmMtTuUvPqSz';
const PAL_HEX = ['#181425','#262b44','#3a4466','#5a6988','#8b9bb4','#c0cbdc','#ffffff','#a22633','#e43b44','#ff0044',
  '#f6757a','#f77622','#feae34','#fee761','#63c74d','#3e8948','#265c42','#193c3e','#124e89','#0099db','#2ce8f5',
  '#be4a2f','#d77643','#ead4aa','#e4a672','#b86f50','#733e39','#3e2731','#68386c','#b55088','#e8b796','#c28569'];
const C = {}; PAL_KEYS.split('').forEach((k, i) => C[k] = i);
const PAL_RGB = PAL_HEX.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const PAL32 = new Uint32Array(PAL_RGB.map(([r, g, b]) => (255 << 24 | b << 16 | g << 8 | r) >>> 0));
function nearestPal(r, g, b, not) {
  let best = 0, bd = 1e9;
  PAL_RGB.forEach(([R, G, B], i) => { if (i === not) return; const d = (R - r) ** 2 * 3 + (G - g) ** 2 * 4 + (B - b) ** 2 * 2; if (d < bd) { bd = d; best = i; } });
  return best;
}
// darker / much darker palette index for storm shading
const DARK = PAL_RGB.map(([r, g, b], i) => i === 0 ? 0 : nearestPal(r * .55, g * .55, b * .7, i));
const DARK2 = PAL_RGB.map(([r, g, b], i) => DARK[DARK[i]]);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = Math.random;
const rf = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(a + (b - a + 1) * rnd());
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
function wpick(obj) { let t = 0; for (const k in obj) t += obj[k]; let r = rnd() * t; for (const k in obj) { r -= obj[k]; if (r <= 0) return k; } return Object.keys(obj)[0]; }
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ------------------------------ snacks ------------------------------ */
// tier: c common, s regional specialty, r rare, g cargo (falls off blue trucks)
const SNACKS = {
  shuijiao: { zh: '水餃', py: 'shuǐjiǎo', en: 'Boiled dumplings', t: 'c', d: 'Pleated pork-and-cabbage pockets. Dip in soy, black vinegar and chili.' },
  chayedan: { zh: '茶葉蛋', py: 'cháyèdàn', en: 'Tea egg', t: 'c', d: 'Stewed in tea and soy by every convenience store register, marbled like old porcelain.' },
  jipai: { zh: '雞排', py: 'jīpái', en: 'Fried chicken cutlet', t: 'c', d: 'Bigger than your face. Pepper salt, chili optional, napkins mandatory.' },
  xiangchang: { zh: '烤香腸', py: 'kǎo xiāngcháng', en: 'Grilled sausage', t: 'c', d: 'Sweet Taiwanese pork sausage, charred on a stick. Eat with a raw garlic clove.' },
  diguaqiu: { zh: '地瓜球', py: 'dìguāqiú', en: 'Sweet potato balls', t: 'c', d: 'Squished while frying until they puff up hollow, crisp and chewy.' },

const SPR = {}; // filled by the art <script> near the end of the file
const DEBUG = /debug/.test(location.search);
const SLOT_DEFAULT = 'RBYe';
const sprCache = new Map();
// slots: string of palette keys replacing digits 1..4. mode: 'sil' silhouette, 'white' flash
function spr(id, slots, flip, mode) {
  const key = id + '|' + (slots || '') + '|' + (flip ? 1 : 0) + (mode || '');
  let c = sprCache.get(key);
  if (c !== undefined) return c;
  const rows = SPR[id];
  if (!rows) { sprCache.set(key, null); return null; }
  const h = rows.length, w = rows[0].length;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'), img = cx.createImageData(w, h), u = new Uint32Array(img.data.buffer);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][flip ? w - 1 - x : x];
    if (ch === '.' || ch === undefined) continue;
    let idx;
    if (ch >= '1' && ch <= '4') idx = C[(slots || SLOT_DEFAULT)[ch.charCodeAt(0) - 49] || SLOT_DEFAULT[ch.charCodeAt(0) - 49]];
    else idx = C[ch];
    if (idx === undefined) continue;
    if (mode === 'sil') idx = C.N; else if (mode === 'white') idx = C.w; else if (mode === 'dark') idx = DARK[idx];
    u[y * w + x] = PAL32[idx];

  cx.putImageData(img, 0, 0);
  sprCache.set(key, c);
  return c;
}
const urlCache = new Map();
function sprURL(id, slots, mode) {
  const k = id + '|' + (slots || '') + (mode || '');
  if (urlCache.has(k)) return urlCache.get(k);
  const c = spr(id, slots, false, mode);
  const u = c ? c.toDataURL() : '';
  urlCache.set(k, u);
  return u;
}

/* tiny 3x5 digits for in-world popups */
const DIG = { '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001', '5': '111100111001111',
  '6': '111100111101111', '7': '111001001001001', '8': '111101111101111', '9': '111101111001111', '+': '000010111010000', '-': '000000111000000',
  'x': '000101010101000', '!': '010010010000010', '?': '111001011000010' };
function drawDigits(ctx, str, x, y, col, shadow) {
  str = String(str);
  const w = str.length * 4 - 1; x = Math.round(x - w / 2); y = Math.round(y);
  for (let pass = shadow ? 0 : 1; pass < 2; pass++) {
    ctx.fillStyle = pass ? col : PAL_HEX[0];
    const o = pass ? 0 : 1;
    for (let i = 0; i < str.length; i++) {
      const g = DIG[str[i]]; if (!g) continue;
      for (let b = 0; b < 15; b++) if (g[b] === '1') {

        if (o) { ctx.fillRect(px - 1, py, 3, 1); ctx.fillRect(px, py - 1, 1, 3); }
        else ctx.fillRect(px, py, 1, 1);
      }
    }
  }
}

/* crisp pixel text: render with the pixel font, threshold alpha, optional 1px outline */
const txtCache = new Map();
function textSpr(str, col, outline) {
  const key = str + '|' + col + '|' + (outline || '');
  let c = txtCache.get(key);
  if (c) return c;
  const m = document.createElement('canvas').getContext('2d');
  m.font = '12px Cubic11';

  c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');

  const img = x.getImageData(0, 0, w, h), d = img.data, out = x.createImageData(w, h), o = out.data;
  const [r, g, b] = PAL_RGB[C[col]];
  const on = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) on[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  for (let i = 0; i < w * h; i++) {
    if (on[i]) { o[i * 4] = r; o[i * 4 + 1] = g; o[i * 4 + 2] = b; o[i * 4 + 3] = 255; continue; }

  }
  x.putImageData(out, 0, 0);
  txtCache.set(key, c);

}

/* =========================================================================
   Audio: everything synthesized with WebAudio

  ctx: null, out: null, wind: null, windGain: null, windFilt: null, noiseBuf: null,
  init() {

    if (!AC) return;
    const c = this.ctx = new AC();
    this.out = c.createGain(); this.out.gain.value = save.mute ? 0 : .55; this.out.connect(c.destination);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);

  noise(dur, vol = .2, freq = 1200, type = 'lowpass', delay = 0, f2 = 0) {

    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);

};

const SFX = {
  pickup(n, tier) {

  hit() { AU.noise(.3, .3, 900, 'lowpass', 0, 120); AU.tone(140, .25, 'sawtooth', .12, 50); },
  honk() { [0, .22].forEach(d => { AU.tone(392, .16, 'square', .07, 0, d); AU.tone(466, .16, 'square', .06, 0, d); }); },
  thunder() { AU.noise(1.4, .22, 400, 'lowpass', 0, 60); },

  ability() { [0, 7, 12, 19, 24].forEach((s, i) => AU.tone(330 * Math.pow(2, s / 12), .14, 'square', .07, 0, i * .05)); },

};

}
function drawParts() {

/* ---------- Typhoon Hangry ---------- */
function drawStorm() {
  const t = G.t, s = G.storm;
  const front = PY + (pdI - Math.round(s.d));

    const row = y * W;

      if (y < edge) continue;

      const v = Math.sin(Math.atan2(dy, dx) * 2 + r * .14 - t * 2.2) + .5 * Math.sin(r * .3 + t * 3);
      let c = y - edge < 2 ? C.G : v > .8 ? C.g : v > .15 ? C.N : v > -.5 ? C.n : (hash2(x, y) < .5 ? C.P : C.k);
      if (((x + y * 2 + (t * 90 | 0)) % 17) === 0) c = C.G;

    }
  }
  stormCtx.putImageData(stormImg, 0, 0, 0, top, W, H - top);
  if (s.glitch > 0) {
    for (let k = 0; k < 6; k++) { const yy = top + (mr() * (H - top) | 0), hh = 2 + (mr() * 6 | 0); lctx.drawImage(stormCv, 0, yy, W, hh, (mr() - .5) * 10, yy, W, hh); }
  }
  lctx.drawImage(stormCv, 0, top, W, H - top, 0, top, W, H - top);
  if (G.bolt && front < H) {
    lctx.fillStyle = PAL_HEX[C.Y];
    let x = G.bolt.x | 0;
    for (let y = Math.max(front, 0); y < H; y += 3) { x += Math.round((hash2(x, y) - .5) * 6); lctx.fillRect(x, y, 1, 3); }
  }
  // the face
  if (front < H - 8) {
    const fx = Math.round(cx0 + Math.sin(t * .7) * 10), fy = front + 16;
    const lookX = clamp(Math.round((SX(G.p.x) - fx) / 30), -1, 1);
    const eye = (ex, flip) => {
      lctx.fillStyle = PAL_HEX[C.w]; lctx.fillRect(ex - 4, fy - 2, 9, 5);
      lctx.fillStyle = PAL_HEX[C.R]; lctx.fillRect(ex - 1 + lookX, fy - 1, 3, 3);
      lctx.fillStyle = PAL_HEX[C.k];
      for (let i = 0; i < 9; i++) lctx.fillRect(ex - 4 + i, fy - 4 + Math.round((flip ? 8 - i : i) * .35), 1, 2);
    };
    eye(fx - 12, false); eye(fx + 12, true);
    const chomp = s.munch > 0 ? Math.abs(Math.sin(t * 14)) : Math.abs(Math.sin(t * 4));
    const mh = 3 + Math.round(chomp * 7), mw = 30, my = fy + 7;
    lctx.fillStyle = PAL_HEX[C.k]; lctx.fillRect(fx - mw / 2, my, mw, mh);
    lctx.fillStyle = PAL_HEX[C.r]; lctx.fillRect(fx - mw / 2 + 3, my + mh - 2, mw - 6, 2);
    lctx.fillStyle = PAL_HEX[C.w];
    for (let i = 0; i < 6; i++) { lctx.fillRect(fx - mw / 2 + 2 + i * 5, my, 3, 2); lctx.fillRect(fx - mw / 2 + 3 + i * 5, my + 2, 1, 1); }
    if (s.glitch > 0) dspr('glitch', fx + (mr() - .5) * 30, fy + (mr() - .5) * 10);
  }
}

/* ---------- minimap & route map ---------- */
const MAPB = { lon0: 119.95, lon1: 122.1, lat0: 21.85, lat1: 25.35 };
const proj = (lon, lat, w, h) => [(lon - MAPB.lon0) / (MAPB.lon1 - MAPB.lon0) * w, (MAPB.lat1 - lat) / (MAPB.lat1 - MAPB.lat0) * h];
const islandCache = {};
function island(w, h) {
  const key = w + 'x' + h;
  if (islandCache[key]) return islandCache[key];
  const poly = TW_POLY.map(([lo, la]) => proj(lo, la, w, h));
  const inside = (x, y) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  const cnv = document.createElement('canvas'); cnv.width = w; cnv.height = h;
  const x = cnv.getContext('2d'), im = x.createImageData(w, h), u = new Uint32Array(im.data.buffer);
  const [ax, ay] = proj(121.62, 24.95, w, h), [bx, by] = proj(120.85, 22.3, w, h);
  const mask = new Uint8Array(w * h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) mask[j * w + i] = inside(i + .5, j + .5) ? 1 : 0;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if (!mask[j * w + i]) continue;
    const edge = !mask[j * w + i - 1] || !mask[j * w + i + 1] || !mask[(j - 1) * w + i] || !mask[(j + 1) * w + i];
    const t = clamp(((i - ax) * (bx - ax) + (j - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2), 0, 1);
    const md = Math.hypot(i - (ax + t * (bx - ax)), j - (ay + t * (by - ay)));
    u[j * w + i] = PAL32[edge ? C.e : md < w * .07 ? C.f : C.E];
  }
  x.putImageData(im, 0, 0);
  return islandCache[key] = cnv;
}
function routePos(w, h) {
  const pts = G.route.map(id => proj(REG[id].lon, REG[id].lat, w, h));
  const k = Math.min(G.regIdx, pts.length - 1), r = G.regions[k];
  const fr = clamp((G.p.d - r.d0) / ((isFinite(r.dEnd) ? r.dEnd : r.d0 + REGION_LEN) - r.d0), 0, 1);
  const pos = k === 0 ? pts[0] : [lerp(pts[k - 1][0], pts[k][0], fr), lerp(pts[k - 1][1], pts[k][1], fr)];
  return { pts, pos, k };
}
function line(x, a, b, col) {
  x.fillStyle = col;
  const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1])));
  for (let i = 0; i <= n; i++) x.fillRect(Math.round(lerp(a[0], b[0], i / n) - .5), Math.round(lerp(a[1], b[1], i / n) - .5), 1, 1);
}
function drawMinimap(cnv, big) {
  if (!G) return;

  x.clearRect(0, 0, w, h);
  x.drawImage(island(w, h), 0, 0);
  if (big) for (const id in REG) { const [px, py] = proj(REG[id].lon, REG[id].lat, w, h); x.fillStyle = PAL_HEX[C.l]; x.fillRect(Math.round(px) - 1, Math.round(py) - 1, 2, 2); }
  const { pts, pos, k } = routePos(w, h);
  for (let i = 1; i <= k; i++) line(x, pts[i - 1], i === k ? pos : pts[i], PAL_HEX[C.Y]);
  if (big) line(x, pts[k], pos, PAL_HEX[C.Y]);
  x.fillStyle = PAL_HEX[C.w]; x.fillRect(Math.round(pts[0][0]) - 1, Math.round(pts[0][1]) - 1, 3, 3);
  const blink = big || ((performance.now() / 250 | 0) & 1);

    const [px, py] = pos, s = spr('ico_storm');

  } else if (blink) { x.fillStyle = PAL_HEX[C.R]; x.fillRect(Math.round(pos[0]) - 1, Math.round(pos[1]) - 1, 3, 3); }
}

function favOf(id) { const t = G.fTally[id]; let best = null, n = 0; for (const k in t) if (t[k] > n) { n = t[k]; best = k; } return [best, n]; }
const QUIPS = { jeremy: [['n', 'q_j1'], ['', 'q_j2'], ['', 'q_j3']], riley: [['n', 'q_r1'], ['', 'q_r2'], ['', 'q_r3']], caleb: [['', 'q_c1'], ['', 'q_c2'], ['n', 'q_c3']],

function bindInput() {

  });

  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = 0;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = 0;
  });
  $('abilityBtn').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); useAbility(); });
  $('pauseBtn').addEventListener('click', () => { if (state === 'play') pauseGame(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pauseGame(); });
  const click = (id, fn) => $(id).addEventListener('click', () => { AU.init(); SFX.ui(); fn(); });
  click('playBtn', () => { buildSelect(); state = 'select'; show('select'); });
  click('goBtn', startGame);
  click('logBtn', openLog);
  click('credBtn', () => { state = 'credits'; show('credits'); });
  click('aboutBtn', () => { state = 'about'; show('aboutS'); });
  click('aboutBack', toTitle);
  click('logBack', toTitle);
  click('credBack', toTitle);
  click('resumeBtn', resumeGame);
  click('quitBtn', toTitle);
  click('againBtn', startGame);
  click('menuBtn', toTitle);
  click('shareBtn', share);
  $('tglSound').addEventListener('click', toggleSound);
  $('tglMotion').addEventListener('click', toggleMotion);
  $('pSound').addEventListener('click', toggleSound);
  $('pMotion').addEventListener('click', toggleMotion);
  $('tglLang').addEventListener('click', toggleLang);
  $('pLang').addEventListener('click', toggleLang);
  $('vehCards').addEventListener('click', e => { const b = e.target.closest('[data-veh]'); if (!b) return; save.veh = b.dataset.veh; persist(); SFX.ui(); buildSelect(); });
  $('leadCards').addEventListener('click', e => { const b = e.target.closest('[data-lead]'); if (!b) return; save.lead = b.dataset.lead; persist(); SFX.ui(); buildSelect(); });
  $('logGrid').addEventListener('click', e => { const b = e.target.closest('[data-snack]'); if (b) logDetail(b.dataset.snack); });
}
function pauseGame() { state = 'pause'; drag = null; keys.l = keys.r = 0; AU.setWind(0); syncToggles(); show('pause'); }
function resumeGame() { state = 'play'; show(null); }

/* ---------- main loop ---------- */
function frame(ts) {
  const dt = Math.min(.05, Math.max(0, (ts - lastTs) / 1000));
  lastTs = ts;
  if (state === 'play') {
    update(dt);
    if (!G.over) updateHUD();
    else if (G.overT > 1.4 && !G.overShown) { G.overShown = true; showOver(); }
  } else if (state === 'over' || (G && G.demo && state !== 'pause')) update(dt);
  render();
  requestAnimationFrame(frame);
}
async function boot() {
  setupCanvas();
  window.addEventListener('resize', resize);
  if (typeof FONT_B64 === 'string') {
    try { const ff = new FontFace('Cubic11', `url(data:font/woff2;base64,${FONT_B64})`); await ff.load(); document.fonts.add(ff); } catch (e) { console.warn('font', e); }
  }
  if (typeof LICENSE_TEXT === 'string') $('licText').textContent = LICENSE_TEXT;
  bindInput();
  applyLang();
  syncToggles();
  toTitle();
  requestAnimationFrame(t => { lastTs = t; requestAnimationFrame(frame); });
}
window.addEventListener('load', boot);
